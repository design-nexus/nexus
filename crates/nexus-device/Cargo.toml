[package]
name = "nexus-device"
version = "0.1.0"
description = "Launcher replace, audit, install and settings backup for Nexus"
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nexus-adb = { path = "../nexus-adb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
